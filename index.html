const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const rand = (a, b) => a + Math.random() * (b - a);
const brl = (v) => "$" + v.toFixed(2);
const formatTime = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;

/* ---------- pixel pet sprite (12x12 hand-authored bitmap) ---------- */
const BODY_TOP = ["000111111000", "001111111100", "011111111110", "011111111110"];
const EYES_OPEN = ["111101101111", "111101101111"];
const EYES_SLEEPY = ["111101101111", "111111111111"];
const EYES_CLOSED = ["111111111111", "111101101111"];
const ROW_BLANK = "111111111111";
const MOUTH = { neutral: "111110011111", happy: "111100001111", sad: "111111111111" };
const BODY_BOTTOM = ["111111111111", "011111111110", "001111111100", "000110011000"];

function buildSprite(moodKey, tint) {
  const eyes = moodKey === "asleep" ? EYES_CLOSED : moodKey === "hungry" ? EYES_SLEEPY : EYES_OPEN;
  const mouth = moodKey === "happy" ? MOUTH.happy : (moodKey === "hungry" || moodKey === "asleep") ? MOUTH.sad : MOUTH.neutral;
  const rows = [...BODY_TOP, ...eyes, ROW_BLANK, mouth, ...BODY_BOTTOM];
  if (!tint) return rows;
  const grid = rows.map((r) => r.split(""));
  const paint = (idxs, cols) => {
    idxs.forEach((ri) => {
      if (!grid[ri]) return;
      grid[ri] = grid[ri].map((c, ci) => (c === "1" && (!cols || cols.includes(ci)) ? "4" : c));
    });
  };
  if (tint.slot === "body") {
    if (tint.style === "skirt") {
      paint([8, 9]); // blusa/cintura: tinge o que ja existe
      for (let c = 1; c <= 10; c++) grid[10][c] = "4"; // alarga um pouco
      for (let c = 0; c <= 11; c++) grid[11][c] = "4"; // barra bem larga (evase)
    } else if (tint.style === "tie") paint([7, 8, 9], [5, 6]); // faixa fina no centro
    else paint([8, 9, 10]); // camiseta/jaqueta/mochila
  } else if (tint.slot === "head") paint([0, 1]);
  else if (tint.slot === "feet") paint([11]);
  return grid.map((r) => r.join(""));
}

/* ---------- evolution: egg + generative creature grids ---------- */
const SHAPES = {
  round: { sx: 0.42, sy: 0.42 },
  tall: { sx: 0.33, sy: 0.46 },
  wide: { sx: 0.46, sy: 0.33 },
};

function buildEggGrid(size = 10) {
  const grid = Array.from({ length: size }, () => Array(size).fill(0));
  const cx = (size - 1) / 2, cy = (size - 1) / 2;
  const rx = size * 0.36, ry = size * 0.46;
  for (let r = 0; r < size; r++) {
    for (let c = 0; c < size; c++) {
      const nx = (c - cx) / rx, ny = (r - cy) / ry * 1.05;
      if (nx * nx + ny * ny <= 1) grid[r][c] = 1;
    }
  }
  return grid.map((row) => row.join(""));
}

function buildEvolvedGrid(species, size, moodKey, tint) {
  const { sx, sy } = SHAPES[species.shape];
  const cx = (size - 1) / 2, cy = (size - 1) / 2;
  const rx = size * sx, ry = size * sy;
  const grid = Array.from({ length: size }, () => Array(size).fill(0));
  const set = (r, c, v) => { if (r >= 0 && r < size && c >= 0 && c < size) grid[r][c] = v; };
  for (let r = 0; r < size; r++) {
    for (let c = 0; c < size; c++) {
      const nx = (c - cx) / rx, ny = (r - cy) / ry;
      if (nx * nx + ny * ny <= 1) grid[r][c] = 1;
    }
  }
  const topRow = Math.round(cy - ry);
  const bottomRow = Math.round(cy + ry);
  const leftCol = Math.round(cx - rx);
  const rightCol = Math.round(cx + rx);
  const feats = species.features || [];
  if (feats.includes("ear")) {
    set(topRow - 1, Math.round(cx - rx * 0.55), 1);
    set(topRow, Math.round(cx - rx * 0.55), 1);
    set(topRow - 1, Math.round(cx + rx * 0.55), 1);
    set(topRow, Math.round(cx + rx * 0.55), 1);
  }
  if (feats.includes("horn")) {
    set(topRow - 1, Math.round(cx - rx * 0.3), 1);
    set(topRow - 1, Math.round(cx + rx * 0.3), 1);
  }
  if (feats.includes("wing")) {
    set(Math.round(cy), leftCol - 1, 1);
    set(Math.round(cy) - 1, leftCol - 1, 1);
    set(Math.round(cy), rightCol + 1, 1);
    set(Math.round(cy) - 1, rightCol + 1, 1);
  }
  if (feats.includes("spike")) {
    set(topRow - 1, Math.round(cx), 1);
    set(topRow - 1, Math.round(cx - rx * 0.4), 1);
    set(topRow - 1, Math.round(cx + rx * 0.4), 1);
  }
  if (feats.includes("antenna")) {
    set(topRow - 2, Math.round(cx), 1);
    set(topRow - 1, Math.round(cx), 1);
  }
  if (feats.includes("tail")) {
    set(bottomRow - 1, rightCol + 1, 1);
    set(bottomRow - 2, rightCol + 1, 1);
  }
  const asleep = moodKey === "asleep";
  const eyeRow = Math.round(cy - ry * 0.15);
  const eyeOffset = Math.max(1, Math.round(rx * 0.42));
  if (!asleep) {
    // olhos grandes e redondos (2 linhas de altura = mais fofo)
    set(eyeRow, Math.round(cx - eyeOffset), 0);
    set(eyeRow, Math.round(cx + eyeOffset), 0);
    set(eyeRow + 1, Math.round(cx - eyeOffset), 0);
    set(eyeRow + 1, Math.round(cx + eyeOffset), 0);
  } else {
    set(eyeRow + 1, Math.round(cx - eyeOffset), 0);
    set(eyeRow + 1, Math.round(cx + eyeOffset), 0);
  }
  const mouthRow = Math.round(cy + ry * 0.42);
  if (moodKey === "happy") {
    set(mouthRow, Math.round(cx - 1), 0);
    set(mouthRow, Math.round(cx), 0);
    set(mouthRow, Math.round(cx + 1), 0);
  } else if (!asleep) {
    // sorriso fofo padrao, sempre visivel quando acordado
    set(mouthRow, Math.round(cx), 0);
  }
  // patinhas fofas embaixo do corpo
  set(bottomRow + 1, Math.round(cx - rx * 0.35), 1);
  set(bottomRow + 1, Math.round(cx + rx * 0.35), 1);
  // bochechas coradas (fofura extra) - so pinta se ainda for parte do corpo
  const setBlush = (r, c) => { if (r >= 0 && r < size && c >= 0 && c < size && grid[r][c] === 1) grid[r][c] = 2; };
  const cheekRow = eyeRow + 3;
  const cheekOffset = eyeOffset + 1;
  setBlush(cheekRow, Math.round(cx - cheekOffset));
  setBlush(cheekRow, Math.round(cx + cheekOffset));
  if (tint) {
    const paintRange = (r0, r1) => {
      for (let r = Math.max(0, Math.round(r0)); r <= Math.min(size - 1, Math.round(r1)); r++) {
        for (let c = 0; c < size; c++) {
          if (grid[r][c] === 1) grid[r][c] = 4;
        }
      }
    };
    const paintCenter = (r0, r1, halfWidth) => {
      for (let r = Math.max(0, Math.round(r0)); r <= Math.min(size - 1, Math.round(r1)); r++) {
        for (let c = Math.round(cx - halfWidth); c <= Math.round(cx + halfWidth); c++) {
          if (c >= 0 && c < size && grid[r][c] === 1) grid[r][c] = 4;
        }
      }
    };
    if (tint.slot === "body") {
      if (tint.style === "skirt") {
        // saia: cintura normal, depois alarga em triangulo ate a barra (efeito evase)
        const waistRow = eyeRow + 2;
        const flareStart = Math.round(bottomRow - (bottomRow - waistRow) * 0.4);
        paintRange(waistRow, flareStart);
        const flareRows = Math.max(2, bottomRow - flareStart);
        for (let i = 0; i <= flareRows; i++) {
          const r = flareStart + i;
          const extra = Math.round((i / flareRows) * (rx * 0.4 + 2));
          for (let c = leftCol - extra; c <= rightCol + extra; c++) set(r, c, 4);
        }
      } else if (tint.style === "tie") {
        // gravata: faixa fina descendo do centro do tronco
        paintCenter(eyeRow + 2, bottomRow - 1, Math.max(1, Math.round(rx * 0.12)));
      } else {
        paintRange(eyeRow + 2, bottomRow - 2);
      }
    } else if (tint.slot === "head") paintRange(0, eyeRow - 2);
    else if (tint.slot === "feet") paintRange(bottomRow - 1, bottomRow);
  }
  return grid.map((row) => row.join(""));
}

function PixelPet({ moodKey, dirty, level = 1, species = null, outfit = null, foam = 0 }) {
  const slot = outfit ? ACCESSORY_SLOT[outfit] : null;
  const outfitColor = outfit ? ACCESSORY_COLOR[outfit] : null;
  const baked = slot === "body" || slot === "head" || slot === "feet";
  const tint = baked ? { slot, color: outfitColor, style: BODY_TINT_STYLE[outfit] || "full" } : null;
  const bodyColor = level === 0 ? "#B9AE93" : level === 1 || !species ? BABY_COLOR : species.color || "#8FB86E";
  const isLegendary = species && species.name && species.name.startsWith("Legendary");

  const imgKey = level === 0 ? "egg" : level === 1 || !species ? "baby" : species.id;
  const imgSrc = SPECIES_IMAGES[imgKey];
  const imgSize = 180 + level * 16; // cresce um pouco a cada nivel
  const bubbleSize = Math.round(imgSize * 0.16);
  const [bTop, bBottom, bLeft, bRight] = CONTENT_BOUNDS[imgKey] || [0.1, 0.92, 0.05, 0.95];
  const contentW = bRight - bLeft;
  const contentH = bBottom - bTop;
  const centerXPct = (bLeft + contentW / 2) * 100;
  const headCell = Math.round((contentW * imgSize * 0.32) / 8);
  const bodyCell = Math.round((contentW * imgSize * 0.36) / 8);
  const feetCell = Math.round((contentW * imgSize * 0.22) / 8);

  if (imgSrc) {
    return (
      <div
        className={`pixelPet artPet ${moodKey === "happy" ? "bounce" : ""} ${moodKey === "hungry" ? "shake" : ""}`}
        style={{ width: imgSize, height: imgSize }}
      >
        <img
          src={imgSrc}
          alt=""
          draggable={false}
          className="petImg"
          style={{ width: imgSize, height: imgSize, position: "absolute", top: 0, left: 0 }}
        />
        {level > 0 && moodKey === "asleep" && <div className="zzz">Zzz</div>}
        {isLegendary && slot !== "head" && <span className="crown">👑</span>}
        {foam > 0 &&
          FOAM_SPOTS.slice(0, foam).map(([fx, fy], i) => (

function makeSpots(n) {
  const cols = Math.ceil(n / 2);
  const spots = [];
  for (let i = 0; i < n; i++) {
    const row = i < cols ? 0 : 1;
    const col = i % cols;
    const x = cols > 1 ? 10 + col * (80 / (cols - 1)) : 46;
    const y = row === 0 ? 18 : 60;
    spots.push({ x, y });
  }
  return spots;
}

  const canvas = 12 + level;
  const sx = SHAPES[species && species.shape ? species.shape : "round"].sx;
  return 2 * sx * canvas * 7;
}
function getShirtCell(level, species) {
  return Math.max(3, Math.round((getBodyWidthPx(level, species) / 8) * 0.78));
}

            style={{ width: cell, height: cell, background: c === "1" ? color : "transparent" }}
          />
        ))
      )}
    </div>
  );
}

function Trend({ history }) {
  if (history.length < 2) return <span className="trendFlat">▬</span>;
  const diff = history[history.length - 1].p - history[history.length - 2].p;
  if (Math.abs(diff) < 0.01) return <span className="trendFlat">▬</span>;
  return diff > 0 ? <span className="trendUp">▲</span> : <span className="trendDown">▼</span>;
}

    if (!data) return;

    if (typeof data.poupanca === "number") setPoupanca(data.poupanca);
    if (data.pet) setPet((p) => ({ ...p, ...data.pet, asleep: false }));
    if (data.pantry) setPantry(data.pantry);
    if (typeof data.day === "number") setDay(data.day);
    if (Array.isArray(data.items)) {
      setItems((prev) => prev.map((it) => {
        const saved = data.items.find((s) => s.id === it.id);
        return saved ? { ...it, price: saved.price, history: saved.history } : it;
      }));
    }
    if (Array.isArray(data.log)) setLog(data.log);
  };

  const withTimeout = (promise, ms = 3000) =>
    Promise.race([
      Promise.resolve(promise).catch(() => null),
      new Promise((resolve) => setTimeout(() => resolve(null), ms)),
    ]);

  const saveNow = async () => {
    if (!authUser) return;
    try { localStorage.setItem(`cashgotchi_save_${authUser}`, JSON.stringify(buildSaveData())); } catch (e) { /* ignore */ }
    if (!window.storage) return;
    try {
      const current = await withTimeout(window.storage.get(`account:${authUser}`, true));
      const record = current ? JSON.parse(current.value) : { passHash: null };
      record.state = buildSaveData();
      await withTimeout(window.storage.set(`account:${authUser}`, JSON.stringify(record), true));
    } catch (e) { /* best effort */ }
  };

  const enterGame = (nameOverride) => {
    const uname = (nameOverride || authUsername.trim() || `guest${Math.floor(Math.random() * 9000 + 1000)}`).toLowerCase();
    try { localStorage.setItem("cashgotchi_user", uname); } catch (e) { /* ignore */ }
    setAuthUser(uname);

    setCheckingSession(false);

    let alreadySeenTutorial = false;
    try { alreadySeenTutorial = localStorage.getItem("cashgotchi_tutorial_seen") === "1"; } catch (e) { /* ignore */ }

    // reserva local: funciona mesmo fora do Claude (arquivo .html sozinho, sem nuvem)
    let localSave = null;
    try {
      const raw = localStorage.getItem(`cashgotchi_save_${uname}`);
      if (raw) localSave = JSON.parse(raw);
    } catch (e) { /* ignore */ }
    if (localSave) {
      restoreSaveData(localSave);
      pushLog(`WELCOME BACK, ${uname.toUpperCase()}! (LOCAL SAVE)`);
    } else if (!alreadySeenTutorial) {
      setTutorialActive(true);
      setTutorialStep(0);
    }
    if (!alreadySeenTutorial) {
      try { localStorage.setItem("cashgotchi_tutorial_seen", "1"); } catch (e) { /* ignore */ }
    }

    if (window.storage) {
      (async () => {
        try {
          const res = await withTimeout(window.storage.get(`account:${uname}`, true));
          const record = res ? JSON.parse(res.value) : null;
          if (record && record.state) {
            restoreSaveData(record.state);

            pushLog(`ACCOUNT CREATED: ${uname}`);

        } catch (e) { /* cloud sync best effort only, never blocks play */ }
      })();
    }
  };

    saveNow();

      if (isLast) {
        finishFutebol(newScore);
      } else {
        setFutStep((s) => s + 1);
        setFutResult(null);
        setFutKickZone(null);
        setFutKeeperZone(null);
        setWalk({ x: 30, dir: 1 });
      }
    }, 1300);
  };

  const zoneFromX = (x) => (x < 23 ? 0 : x < 46 ? 1 : 2);

  const moverJogador = (dir) => {
    if (futResult || futFinished) return;
    setWalk((w) => ({ ...w, x: clamp(w.x + dir * 10, 0, 68), dir }));
  };

  const chutarNaPosicao = () => {
    if (futResult || futFinished) return;
    chutar(zoneFromX(walk.x));
  };

  const makeChoices = (answer) => {
    const choices = new Set([answer]);
    let guard = 0;
    while (choices.size < 4 && guard < 30) {
      guard++;
      const delta = Math.max(1, Math.round(rand(1, Math.abs(answer) * 0.25 + 5)));
      const wrong = Math.random() < 0.5 ? answer + delta : answer - delta;
      if (wrong !== answer && wrong >= 0) choices.add(wrong);
    }
    return Array.from(choices).sort(() => Math.random() - 0.5);
  };

  const makeQuizQuestion = (level) => {
    const r = (a, b) => Math.floor(rand(a, b));
    let question, answer;
    if (level === 1) {
      if (Math.random() < 0.5) {
        const a = r(5, 40), b = r(1, 30);
        question = `You have $${a}. You earn $${b} more. Total?`;
        answer = a + b;
      } else {
        const x = r(15, 60), y = r(1, x);
        question = `You have $${x}. You spend $${y}. Left?`;
        answer = x - y;
      }
    } else if (level === 2) {
      if (Math.random() < 0.5) {
        const price = r(5, 40);
        const paid = price + [5, 10, 20][r(0, 3)];
        question = `Item costs $${price}. You pay $${paid}. Change?`;
        answer = paid - price;
      } else {
        const base = [10, 20, 40, 50, 80, 100][r(0, 6)];
        const pct = [10, 25, 50][r(0, 3)];
        question = `What is ${pct}% of $${base}?`;
        answer = Math.round((base * pct) / 100);
      }
    } else {
      const type = r(0, 3);
      if (type === 0) {
        const price = [20, 40, 60, 80, 100][r(0, 5)];
        const pct = [10, 20, 25, 50][r(0, 4)];
        question = `Price $${price}, ${pct}% OFF. You pay?`;
        answer = Math.round(price * (1 - pct / 100));
      } else if (type === 1) {
        const daily = [5, 10, 15][r(0, 3)];
        const days = [5, 7, 10][r(0, 3)];
        question = `Save $${daily}/day for ${days} days. Total?`;
        answer = daily * days;
      } else {
        const principal = [50, 100, 200][r(0, 3)];
        const pct = [5, 10][r(0, 2)];
        question = `Invest $${principal} at ${pct}% interest. New total?`;
        answer = Math.round(principal * (1 + pct / 100));
      }
    }
    return { question, answer, choices: makeChoices(answer) };
  };

  const startMathGame = (level) => {
    if (pet.level === 0) return doFlash("HATCH THE EGG FIRST!");
    if (pet.asleep) return doFlash("HES SLEEPING...");
    if (inBath) return doFlash("HES IN THE BATH...");
    if (eating) return doFlash("HES EATING...");
    if (onToilet) return doFlash("HES IN THE BATHROOM...");
    clearTimeout(quizTimeoutRef.current);
    setQuizLevel(level);
    setQuizStep(0);
    setQuizScore(0);
    setQuizResult(null);
    setQuizFinished(false);
    setQuizQuestion(makeQuizQuestion(level));
    setLevelPick(null);
    setGame("math");
  };

  const finishMathGame = (finalScore) => {
    const cfg = MATH_LEVELS[quizLevel - 1];
    setQuizFinished(true);
    const diversaoGain = clamp(finalScore * 6, 10, 35);
    const coin = finalScore >= cfg.threshold ? +rand(3, 8 + quizLevel * 2).toFixed(2) : 0;
    setPet((p) => ({ ...p, diversao: clamp(p.diversao + diversaoGain, 0, 100) }));
    if (coin > 0) {
      setSaldo((s) => +(s + coin).toFixed(2));
      pushLog(`GOT ${finalScore}/${cfg.rounds} RIGHT ON ${cfg.label} MATH! EARNED ${brl(coin)}`);
      doFlash(`+${brl(coin)}!`);
    } else {
      pushLog(`GOT ${finalScore}/${cfg.rounds} RIGHT ON ${cfg.label} MATH. FUN+`);
      doFlash("KEEP PRACTICING!");
    }
  };

  const answerQuiz = (choice) => {
    if (quizResult || quizFinished || !quizQuestion) return;
    const correct = choice === quizQuestion.answer;
    setQuizResult(correct ? "right" : "wrong");
    const newScore = quizScore + (correct ? 1 : 0);
    setQuizScore(newScore);
    const isLast = quizStep + 1 >= MATH_LEVELS[quizLevel - 1].rounds;
    quizTimeoutRef.current = setTimeout(() => {
      if (isLast) {
        finishMathGame(newScore);
      } else {
        setQuizStep((s) => s + 1);
        setQuizResult(null);
        setQuizQuestion(makeQuizQuestion(quizLevel));
      }
    }, 1100);
  };

  useEffect(() => {
    if (game === "math" && !quizFinished && !quizQuestion) {
      setQuizQuestion(makeQuizQuestion(quizLevel));
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [game, quizFinished, quizQuestion, quizLevel]);

  const exitGame = () => {
    clearInterval(catchTimerRef.current);
    clearTimeout(futTimeoutRef.current);
    clearTimeout(spotTimerRef.current);
    clearTimeout(quizTimeoutRef.current);
    setCatchActive(false);
    setActiveSpot(null);
    setGame(null);
    setLevelPick(null);
  };

  const abrirJogo = (gameType) => {
    setGamesTabOpen(false);
    setView("home");
    setRoom("playroom");
    setGame(null);
    setLevelPick(gameType);
  };

  const TUB_X = 4;
  const banho = () => {
    if (pet.level === 0) return doFlash("HATCH THE EGG FIRST!");
    if (pet.asleep) return doFlash("HES SLEEPING...");
    if (inBath) return;
    if (banhoCooldown > 0) return doFlash("ALREADY SQUEAKY CLEAN");
    setInBath(true);
    setBathPhase("scrubbing");
    setScrubCount(0);
    setWalk((w) => ({ ...w, x: TUB_X, dir: 1 }));
    pushLog("GOT INTO THE TUB");
    doFlash("GETTING INTO THE TUB...");
  };

  const scrubSoap = () => {
    if (bathPhase !== "scrubbing") return;
    setScrubCount((c) => {
      const next = c + 1;
      if (next >= SCRUB_TARGET) {
        setBathPhase("rinsing");
        doFlash("ALL SOAPED UP! RINSE HIM OFF!");
      }
      return next;
    });
  };

  const startScrubHold = (e) => {
    if (e && e.preventDefault) e.preventDefault();
    if (bathPhase !== "scrubbing") return;
    scrubSoap();
    clearInterval(scrubHoldRef.current);
    scrubHoldRef.current = setInterval(scrubSoap, 180);
  };

  const stopScrubHold = () => {
    clearInterval(scrubHoldRef.current);
  };

  useEffect(() => {
    if (bathPhase !== "scrubbing") clearInterval(scrubHoldRef.current);
  }, [bathPhase]);
  useEffect(() => () => clearInterval(scrubHoldRef.current), []);

  const rinseOff = () => {
    if (bathPhase !== "rinsing") return;
    setPet((p) => ({ ...p, higiene: clamp(p.higiene + 30, 0, 100) }));
    setBanhoCooldown(1);
    setInBath(false);
    setBathPhase(null);
    setScrubCount(0);
    bumpTask("bath");
    pushLog("TOOK A BATH! HYGIENE+");
    doFlash("ALL CLEAN!");
  };

  const TOILET_X = 56;
  const irAoBanheiro = () => {
    if (pet.level === 0) return doFlash("HATCH THE EGG FIRST!");
    if (pet.asleep) return doFlash("HES SLEEPING...");
    if (inBath) return doFlash("HES IN THE BATH...");
    if (eating) return doFlash("HES EATING...");
    if (onToilet) return doFlash("HES IN THE BATHROOM...");
    if (!needsToilet) return doFlash("DOESNT NEED TO GO NOW");
    setOnToilet(true);
    setWalk((w) => ({ ...w, x: TOILET_X, dir: -1 }));
    doFlash("SITTING ON THE TOILET...");
    toiletTimeoutRef.current = setTimeout(() => {
      setNeedsToilet(false);
      setPet((p) => ({ ...p, higiene: clamp(p.higiene + 15, 0, 100) }));
      setOnToilet(false);
      pushLog("WENT TO THE BATHROOM AND FLUSHED");
      doFlash("ALL CLEAN!");
    }, 1800);
  };

  const BED_X = 30;
  const dormir = () => {
    if (pet.level === 0) return doFlash("HATCH THE EGG FIRST!");
    if (inBath) return doFlash("HES IN THE BATH...");
    if (eating) return doFlash("HES EATING...");
    if (onToilet) return doFlash("HES IN THE BATHROOM...");
    if (pet.asleep) return doFlash(`ONLY WAKES UP ON HIS OWN (${formatTime(sleepSeconds)})`);
    setPet((p) => ({ ...p, asleep: true }));
    setWalk((w) => ({ ...w, x: BED_X, dir: 1 }));
    const duration = Math.round(clamp(((100 - pet.energy) / 100) * 120, 30, 120));
    pushLog(`WENT TO BED... ZZZ (SLEEPS FOR ${formatTime(duration)})`);
    doFlash(`SLEEPING FOR ${formatTime(duration)}...`);
    setSleepSeconds(duration);
    clearInterval(sleepIntervalRef.current);
    sleepIntervalRef.current = setInterval(() => {
      setSleepSeconds((s) => {
        if (s <= 1) {
          clearInterval(sleepIntervalRef.current);
          setPet((p) => ({ ...p, asleep: false, taskCounts: { ...p.taskCounts, sleep: (p.taskCounts.sleep || 0) + 1 } }));
          pushLog("WOKE UP RESTED!");
          doFlash("WOKE UP!");
          return 0;
        }
        return s - 1;
      });
    }, 1000);
  };

  const TABLE_X = 30;
  const comerDaDespensa = (itemId) => {
    if (pet.level === 0) return doFlash("HATCH THE EGG FIRST!");
    if (pet.asleep) return doFlash("HES SLEEPING...");
    if (inBath) return doFlash("HES IN THE BATH...");
    if (eating) return doFlash("HES EATING...");
    if (onToilet) return doFlash("HES IN THE BATHROOM...");
    const now = Date.now();
    if (now - lastEatRef.current < 500) return;
    const qty = pantry[itemId] || 0;
    if (qty <= 0) return doFlash("ALL GONE! GO TO THE STORE");
    lastEatRef.current = now;
    setEating(true);
    setWalk((w) => ({ ...w, x: TABLE_X, dir: 1 }));
    doFlash("SITTING DOWN TO EAT...");
    eatTimeoutRef.current = setTimeout(() => {
      const foodItem = items.find((i) => i.id === itemId);
      setPantry((p) => ({ ...p, [itemId]: Math.max(0, p[itemId] - 1) }));
      setPet((p) => ({ ...p, hunger: clamp(p.hunger + foodItem.gain, 0, 100), taskCounts: { ...p.taskCounts, eat: (p.taskCounts.eat || 0) + 1 } }));
      pushLog(`ATE ${foodItem.name} FROM THE PANTRY (${Math.max(0, qty - 1)} LEFT)`);
      doFlash("YUM YUM!");
      setEating(false);
    }, 2000);
  };

  const trabalhar = () => {
    if (pet.level === 0) return doFlash("HATCH THE EGG FIRST!");
    if (pet.asleep) return doFlash("HES SLEEPING...");
    if (inBath) return doFlash("HES IN THE BATH...");
    if (eating) return doFlash("HES EATING...");
    if (onToilet) return doFlash("HES IN THE BATHROOM...");
    if (workCooldown > 0) return doFlash("RESTING...");
    const earn = +(pet.energy < 20 ? rand(4, 8) : rand(9, 19)).toFixed(2);
    setSaldo((s) => +(s + earn).toFixed(2));
    setPet((p) => ({ ...p, energy: clamp(p.energy - 14, 0, 100), taskCounts: { ...p.taskCounts, work: (p.taskCounts.work || 0) + 1 } }));
    setWorkCooldown(2);
    pushLog(`WORKED: +${brl(earn)}`);
    doFlash(`+${brl(earn)}`);
  };

  const comprar = (item) => {
    if (!item) return;
    if (pet.asleep) return doFlash("HES SLEEPING...");
    if (inBath) return doFlash("HES IN THE BATH...");
    if (eating) return doFlash("HES EATING...");
    if (onToilet) return doFlash("HES IN THE BATHROOM...");
    if (saldo < item.price) return doFlash("NOT ENOUGH MONEY");
    const avgPrice = item.history.reduce((a, h) => a + h.p, 0) / item.history.length;
    setSaldo((s) => +(s - item.price).toFixed(2));
    const cheap = item.price < avgPrice * 0.92;
    const expensive = item.price > avgPrice * 1.08;
    setPantry((p) => ({ ...p, [item.id]: (p[item.id] || 0) + 1 }));
    pushLog(`BOUGHT ${item.name} ${brl(item.price)} FOR THE PANTRY${cheap ? " (CHEAP!)" : expensive ? " (PRICEY)" : ""}`);
    doFlash(cheap ? "GREAT BUY!" : expensive ? "BOUGHT IT PRICEY..." : "PURCHASED");
  };

  const depositar = () => {
    const v = clamp(Number(depositAmt) || 0, 0, saldo);
    if (v <= 0) return;
    setSaldo((s) => +(s - v).toFixed(2));
    setPoupanca((p) => +(p + v).toFixed(2));
    pushLog(`DEPOSITED ${brl(v)}`);
    doFlash("DEPOSITED");
  };

  const sacar = () => {
    const v = clamp(Number(depositAmt) || 0, 0, poupanca);
    if (v <= 0) return;
    setPoupanca((p) => +(p - v).toFixed(2));
    setSaldo((s) => +(s + v).toFixed(2));
    pushLog(`WITHDREW ${brl(v)}`);
    doFlash("WITHDRAWN");
  };

  const viewIdx = MENU.findIndex((m) => m.id === view);
  const prevView = () => setView(MENU[(viewIdx - 1 + MENU.length) % MENU.length].id);
  const nextView = () => setView(MENU[(viewIdx + 1) % MENU.length].id);
  const comerPrimeiroDisponivel = () => {
    const disponivel = items.find((i) => i.type === "comida" && (pantry[i.id] || 0) > 0);
    if (!disponivel) return doFlash("PANTRY EMPTY! GO TO THE STORE");
    comerDaDespensa(disponivel.id);
  };
  const banheiroAction = () => {
    if (inBath) {
      if (bathPhase === "scrubbing") scrubSoap();
      else if (bathPhase === "rinsing") rinseOff();
    } else {
      banho();
    }
  };
  const ROOM_ACTIONS = { sala: trabalhar, cozinha: comerPrimeiroDisponivel, playroom: brincar, banheiro: banheiroAction, quarto: dormir };
  const primaryAction = () => {
    if (view === "home") ROOM_ACTIONS[room]?.();
    else if (view === "comida") comprar(items.find((i) => i.id === selectedId));
    else if (view === "banco") depositar();
  };

  const list = items.filter((i) => i.type === "comida");
  const selected = items.find((i) => i.id === selectedId);
  const chartData = selected ? selected.history.map((h) => ({ day: h.day, p: h.p })) : [];
  const chartColor = selected && selected.price < selected.base ? "#3B6B4A" : "#B4402B";
  const currentSpecies = useMemo(() => {
    if (pet.level < 2) return null;
    return (EVOLUTIONS[pet.level] || []).find((s) => s.id === pet.speciesId) || null;
  }, [pet.level, pet.speciesId]);

  const tasksComplete = Object.entries(EVOLVE_REQUIREMENTS).every(
    ([key, need]) => (pet.taskCounts?.[key] || 0) >= need
  );
  const canEvolve = pet.level > 0 && pet.level < 5 && tasksComplete;
  const canDoar = pet.level === 5;
  const tickerText = pet.level === 0
    ? `>> TAP THE EGG TO HATCH IT! (${eggCracks}/${EGG_TAPS_TO_HATCH}) <<`
    : canEvolve
    ? ">> READY TO EVOLVE! TAP THE ✨ <<"
    : canDoar
    ? ">> YOU CAN RELEASE HIM AND ADOPT ANOTHER! TAP THE ✨ <<"
    : pet.asleep
    ? `>> SLEEPING... ONLY WAKES UP ON HIS OWN IN ${formatTime(sleepSeconds)} <<`
    : banner
    ? banner.text
    : `>> ${TIPS[tipIndex]} <<`;

  return (

            radial-gradient(circle at 50% 0%, #30353E 0%, #1B1E24 70%);

        }

          content:""; position:absolute; top:6px; left:50%; transform:translateX(-50%);
          width:14px; height:14px; border-radius:50%; background:#1B1E24;

          text-align:center; font-family:'Press Start 2P', monospace; font-size:13px;

                                else startMathGame(cfg.level);
                              }}
                            >
                              <span className="levelNum">LV{cfg.level}</span>
                              <span className="levelDiff">{cfg.label}</span>
                              <span className="levelDesc">
                                {levelPick === "guess" && `${cfg.spots} SPOTS`}
                                {levelPick === "catch" && `${cfg.spots} HOLES · ${cfg.time}s`}
                                {levelPick === "futebol" && `${cfg.kicks} KICKS`}
                                {levelPick === "math" && cfg.desc}
                              </span>
                            </button>
                          ))}
                        </div>
                        <div className="gameBtnRow">
                          <button className="miniBtn" onClick={() => setLevelPick(null)}>BACK</button>
                        </div>
                      </div>
                    ) : room === "playroom" && game === "guess" ? (
                      <div className="gameOverlay">
                        <div className="gameTitle">WHERE'S THE BALL? · LV{guessLevel}</div>
                        <div className="handsRow">
                          {Array.from({ length: GUESS_LEVELS[guessLevel - 1].spots }).map((_, i) => (
                            <button key={i} className="handBtn" onClick={() => chooseHand(i)} disabled={!!guessResult}>
                              {guessResult && guessHidden === i ? "🟡" : "✊"}
                            </button>
                          ))}
                        </div>
                        {guessResult && (
                          <div className="gameResult">{guessResult === "win" ? "YOU GOT IT!" : "IT WAS SOMEWHERE ELSE..."}</div>
                        )}
                        <div className="gameBtnRow">
                          {guessResult && <button className="miniBtn" onClick={() => startGuess(guessLevel)}>PLAY AGAIN</button>}
                          <button className="miniBtn" onClick={exitGame}>EXIT</button>
                        </div>
                      </div>
                    ) : room === "playroom" && game === "catch" ? (
                      <div className="catchOverlay">
                        <div className="catchHud">⏱{catchTime}s · BALLS:{catchScore} · LV{catchLevel}</div>
                        {catchActive ? (
                          <div className="hideField">
                            {makeSpots(CATCH_LEVELS[catchLevel - 1].spots).map((sp, i) => (
                              <button
                                key={i}
                                className="hideSpot"
                                style={{ left: `${sp.x}%`, top: `${sp.y}%` }}
                                onClick={() => tapSpot(i)}
                              >
                                <span className="holeIc">🕳️</span>
                                {activeSpot === i && <span className="popBall">⚽</span>}
                              </button>
                            ))}
                          </div>
                        ) : (
                          <div className="gameResult">GAME OVER!</div>
                        )}
                        <div className="gameBtnRow">
                          {!catchActive && <button className="miniBtn" onClick={() => startCatch(catchLevel)}>PLAY AGAIN</button>}
                          <button className="miniBtn" onClick={exitGame}>EXIT</button>
                        </div>
                      </div>
                    ) : room === "playroom" && game === "futebol" ? (
                      <div className="gameOverlay futOverlay">
                        <div className="gameTitle">PENALTY VS RIVAL · LV{futLevel}</div>
                        <div className="catchHud futHud">
                          KICK {Math.min(futStep + 1, FUT_LEVELS[futLevel - 1].kicks)}/{FUT_LEVELS[futLevel - 1].kicks} · GOALS:{futScore}
                        </div>

                        <div className="goalNet">
                          <div className="goalMesh" />
                          {!futResult && !futFinished && (
                            <span className="keeperPatrol">🧤</span>
                          )}
                          {futResult && (
                            <span
                              className="keeperInGoal"
                              style={{ left: `${futKeeperZone * 33 + 6}%` }}
                            >
                              🧤
                            </span>
                          )}
                          {futResult === "gol" && (
                            <span className="ballInGoal" style={{ left: `${futKickZone * 33 + 10}%` }}>⚽</span>
                          )}
                        </div>

                        <div className="fieldStrip">
                          <div
                            className="futPlayer"
                            style={{ left: `${walk.x}%`, transform: walk.dir < 0 ? "scaleX(-1)" : "scaleX(1)" }}
                          >
                            <PixelPet moodKey={moodKey} dirty={pet.higiene <= 30} level={pet.level} species={currentSpecies} />
                          </div>
                        </div>

                        {futResult && !futFinished && (
                          <div className="gameResult">{futResult === "gol" ? "GOAL! ⚽" : "SAVED! 🧤"}</div>
                        )}
                        {futFinished && (
                          <div className="gameResult">GAME OVER! {futScore}/{FUT_LEVELS[futLevel - 1].kicks} GOALS</div>
                        )}

                        {!futFinished && (
                          <div className="moveRow">
                            <button className="moveBtn" onClick={() => moverJogador(-1)} disabled={!!futResult}>⬅️</button>
                            <button className="kickBtn" onClick={chutarNaPosicao} disabled={!!futResult}>⚽ KICK</button>
                            <button className="moveBtn" onClick={() => moverJogador(1)} disabled={!!futResult}>➡️</button>
                          </div>
                        )}

                        <div className="gameBtnRow">
                          {futFinished && <button className="miniBtn" onClick={() => startFutebol(futLevel)}>PLAY AGAIN</button>}
                          <button className="miniBtn" onClick={exitGame}>EXIT</button>
                        </div>
                      </div>
                    ) : room === "playroom" && game === "math" ? (
                      <div className="gameOverlay mathGameOverlay">
                        <div className="gameTitle">MATH QUIZ · LV{quizLevel}</div>
                        <div className="catchHud futHud">
                          Q {Math.min(quizStep + 1, MATH_LEVELS[quizLevel - 1].rounds)}/{MATH_LEVELS[quizLevel - 1].rounds} · SCORE:{quizScore}
                        </div>
                        {!quizFinished ? (
                          <>
                            <div className="quizQuestion">{quizQuestion?.question}</div>
                            <div className="mathChoices">
                              {quizQuestion?.choices.map((c, i) => (
                                <button
                                  key={i}
                                  className={`mathChoice ${quizResult && c === quizQuestion?.answer ? "correct" : ""}`}
                                  onClick={() => answerQuiz(c)}
                                  disabled={!!quizResult}
                                >
                                  {c}
                                </button>
                              ))}
                            </div>
                            {quizResult && (
                              <div className="gameResult">{quizResult === "right" ? "CORRECT!" : "WRONG!"}</div>
                            )}
                          </>
                        ) : (
                          <div className="gameResult">GAME OVER! {quizScore}/{MATH_LEVELS[quizLevel - 1].rounds} CORRECT</div>
                        )}
                        <div className="gameBtnRow">
                          {quizFinished && <button className="miniBtn" onClick={() => startMathGame(quizLevel)}>PLAY AGAIN</button>}
                          <button className="miniBtn" onClick={exitGame}>EXIT</button>
                        </div>
                      </div>
                    ) : room === "playroom" ? (
                      <div className="gameSelect">
                        <button className="fixture" style={{ left: "2%" }} onClick={() => setLevelPick("guess")}>
                          <span className="fixIc">🤚</span>
                          <span className="fixLb">GUESS</span>
                        </button>
                        <button className="fixture" style={{ left: "26%" }} onClick={() => setLevelPick("catch")}>
                          <span className="fixIc">🏐</span>
                          <span className="fixLb">CATCH</span>
                        </button>
                        <button className="fixture" style={{ left: "50%" }} onClick={() => setLevelPick("futebol")}>
                          <span className="fixIc">🥅</span>
                          <span className="fixLb">SOCCER</span>
                        </button>
                        <button className="fixture" style={{ left: "74%" }} onClick={() => setLevelPick("math")}>
                          <span className="fixIc">🧮</span>
                          <span className="fixLb">MATH</span>
                        </button>
                      </div>
                    ) : room === "quarto" ? (
                      <div className="bedFixture" onClick={dormir} style={{ left: `${BED_X}%` }}>
                        <div className="bedPillow" />
                        <div className="bedMattress" />
                        <div className="bedLegs"><span /><span /></div>
                        <span className="fixLb bedLbl">{pet.asleep ? formatTime(sleepSeconds) : "SLEEP"}</span>
                      </div>
                    ) : room === "abrigo" ? (
                      <div className="shelterView">
                        {pet.level === 5 ? (
                          <div className="doarBox">
                            {!confirmDoar ? (
                              <>
                                <p className="doarText">
                                  Your pet reached LEVEL 5! If you don't want him anymore, you can release him here and adopt a new egg to restart the journey.
                                </p>
                                <button className="miniBtn" onClick={() => setConfirmDoar(true)}>🎁 RELEASE & ADOPT ANOTHER</button>
                              </>
                            ) : (
                              <>
                                <p className="doarText">ARE YOU SURE? THIS RESETS YOUR PET BACK TO AN EGG.</p>
                                <div className="gameBtnRow">
                                  <button className="miniBtn" onClick={doarPet}>YES, RELEASE</button>
                                  <button className="miniBtn" onClick={() => setConfirmDoar(false)}>CANCEL</button>
                                </div>
                              </>
                            )}
                          </div>
                        ) : (
                          <div className="shelterLocked">
                            <span className="shelterLockIc">🔒</span>
                            <p className="doarText">COME BACK WHEN HE REACHES LEVEL 5 TO ADOPT A NEW PET.</p>
                          </div>
                        )}
                      </div>
                    ) : (
                      <div className="roomDecor">
                        {ROOMS.find((r) => r.id === room).decor.map((d, i) => (
                          <span key={i}>{d}</span>
                        ))}
                      </div>
                    )}
                    {!game && !levelPick && !inBath && room !== "abrigo" && (
                      <div
                        className={`petWalker ${inBath ? "bathing" : ""} ${eating ? "eating" : ""} ${onToilet ? "onToilet" : ""} ${pet.asleep ? "sleeping" : ""}`}
                        style={
                          pet.level === 0
                            ? { left: "50%", transform: "translateX(-50%)" }
                            : { left: `${walk.x}%`, transform: walk.dir < 0 ? "scaleX(-1)" : "scaleX(1)" }
                        }
                        onClick={fazerCarinho}
                      >
                        {inBath && (
                          <div className="bubbles">
                            <span>🫧</span><span>🫧</span><span>🫧</span>
                          </div>
                        )}
                        {eating && <div className="eatingIcon">🍴</div>}
                        {needsToilet && !pet.asleep && !inBath && !eating && !onToilet && (
                          <div className="speechBubble" style={{ transform: walk.dir < 0 ? "scaleX(-1)" : "none" }}>
                            I NEED TO GO!
                          </div>
                        )}
                        <PixelPet moodKey={moodKey} dirty={pet.higiene <= 30 && !inBath} level={pet.level} species={currentSpecies} />
                        {pet.level === 0 && eggCracks > 0 && (
                          <div className="eggCracks">
                            {eggCracks >= 1 && <span className="crack c1" />}
                            {eggCracks >= 2 && <span className="crack c2" />}
                            {eggCracks >= 3 && <span className="crack c3" />}
                            {eggCracks >= 4 && <span className="crack c4" />}
                          </div>
                        )}
                        {pet.level === 0 && eggPieces.map((pc) => (
                          <span
                            key={pc.id}
                            className="eggPiece"
                            style={{ "--dx": `${pc.dx}px`, "--dy": `${pc.dy}px`, "--rot": `${pc.rot}deg` }}
                          />
                        ))}
                      </div>
                    )}
                    {!game && !levelPick && hearts.map((h) => (
                      <span key={h.id} className="heart" style={{ left: `${h.x}%` }}>💗</span>
                    ))}
                  </div>
                  {needsToilet && room !== "banheiro" && (
                    <div className="toiletHint" onClick={() => setRoom("banheiro")}>🚽 HE NEEDS TO GO TO THE BATHROOM</div>
                  )}

                  <div className="segStack">
                    <div className={`segRow ${room === "cozinha" ? "hl" : ""}`}>
                      <span className="segLabel">HUNGER</span>
                      <div className="segTrack">
                        {Array.from({ length: 10 }).map((_, i) => (
                          <span key={i} className={`seg ${i < Math.round(pet.hunger / 10) ? "on" : ""}`} />
                        ))}
                      </div>
                    </div>
                    <div className={`segRow ${room === "quarto" ? "hl" : ""}`}>
                      <span className="segLabel">ENERGY</span>
                      <div className="segTrack">
                        {Array.from({ length: 10 }).map((_, i) => (
                          <span key={i} className={`seg ${i < Math.round(pet.energy / 10) ? "on" : ""}`} />
                        ))}
                      </div>
                    </div>
                    <div className={`segRow ${room === "playroom" ? "hl" : ""}`}>
                      <span className="segLabel">FUN</span>
                      <div className="segTrack">
                        {Array.from({ length: 10 }).map((_, i) => (
                          <span key={i} className={`seg ${i < Math.round(pet.diversao / 10) ? "on" : ""}`} />
                        ))}
                      </div>
                    </div>
                    <div className={`segRow ${room === "banheiro" ? "hl" : ""}`}>
                      <span className="segLabel">HYGIENE</span>
                      <div className="segTrack">
                        {Array.from({ length: 10 }).map((_, i) => (
                          <span key={i} className={`seg ${i < Math.round(pet.higiene / 10) ? "on" : ""}`} />
                        ))}
                      </div>
                    </div>
                    <div className="segRow">
                      <span className="segLabel">LOVE</span>
                      <div className="segTrack">
                        {Array.from({ length: 10 }).map((_, i) => (
                          <span key={i} className={`seg ${i < Math.round(pet.carinho / 10) ? "on" : ""}`} />
                        ))}
                      </div>
                    </div>
                  </div>

                  <div className="hint">
                    {room === "sala" && (workCooldown > 0 ? `B: RESTING (${workCooldown})` : "B: WORK")}
                    {room === "cozinha" && (
                      eating
                        ? "EATING..."
                        : Object.values(pantry).some((q) => q > 0)
                        ? "TAP THE FOOD ON THE TABLE TO EAT"
                        : "PANTRY EMPTY! BUY AT THE STORE"
                    )}
                    {room === "playroom" && (
                      levelPick
                        ? "PICK A DIFFICULTY"
                        : game === "guess"
                        ? (guessResult ? "TAP PLAY AGAIN OR EXIT" : "TAP A SPOT")
                        : game === "catch"
                        ? (catchActive ? "TAP THE BALL FAST!" : "TAP PLAY AGAIN OR EXIT")
                        : game === "futebol"
                        ? (futFinished ? "TAP PLAY AGAIN OR EXIT" : futResult ? "..." : "MOVE AND PRESS KICK")
                        : game === "math"
                        ? (quizFinished ? "TAP PLAY AGAIN OR EXIT" : "PICK THE RIGHT ANSWER")
                        : "TAP A GAME TO PLAY"
                    )}
                    {room === "banheiro" && (
                      inBath
                        ? (bathPhase === "scrubbing" ? "TAP SCRUB TO SOAP HIM UP" : "TAP RINSE TO WASH THE FOAM OFF")
                        : onToilet
                        ? "SITTING ON THE TOILET..."
                        : banhoCooldown > 0
                        ? `B: ALL CLEAN (${banhoCooldown})`
                        : "TAP THE TUB OR THE TOILET"
                    )}
                    {room === "quarto" && (pet.asleep ? `SLEEPING... WAKES UP IN ${formatTime(sleepSeconds)}` : "TAP THE BED TO SLEEP")}
                    {room === "abrigo" && (pet.level === 5 ? "RELEASE HIM TO ADOPT A NEW EGG" : "LOCKED UNTIL LEVEL 5")}
                    {" "}· TAP THE PET: PET HIM
                  </div>
                </div>
              )}

              {view === "comida" && selected && (
                <div>
                  <div className="itemList">
                    {list.map((item) => (
                      <div
                        key={item.id}
                        className={`itemRow ${selectedId === item.id ? "sel" : ""}`}
                        onClick={() => setSelectedId(item.id)}
                      >
                        <span className="cursor">{selectedId === item.id ? "▸" : ""}</span>
                        <span>{item.emoji}</span>
                        <span className="nm">
                          {item.name}
                          <span className="stockTag">HOME:{pantry[item.id] || 0}</span>
                        </span>
                        <span className="pr">
                          <Trend history={item.history} />
                          {brl(item.price)}
                        </span>
                        <button
                          className="buyRowBtn"
                          onClick={(e) => { e.stopPropagation(); setSelectedId(item.id); comprar(item); }}
                          disabled={saldo < item.price}
                        >
                          BUY
                        </button>
                      </div>
                    ))}
                  </div>
                  <div className="chartWrap">
                    <div className="chartLabel">
                      <span>{selected.name}</span>
                      <span>BASE {brl(selected.base)}</span>
                    </div>
                    <ResponsiveContainer width="100%" height={130}>
                      <AreaChart data={chartData} margin={{ top: 6, right: 6, left: -14, bottom: 0 }}>
                        <defs>
                          <linearGradient id="priceFill" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="5%" stopColor={chartColor} stopOpacity={0.4} />
                            <stop offset="95%" stopColor={chartColor} stopOpacity={0.03} />
                          </linearGradient>
                        </defs>
                        <CartesianGrid strokeDasharray="3 3" stroke="rgba(59,68,48,0.15)" vertical={false} />
                        <XAxis
                          dataKey="day"
                          tick={{ fontSize: 10, fill: "#6B7A5C" }}
                          axisLine={{ stroke: "#3B4430", strokeOpacity: 0.3 }}
                          tickLine={false}
                        />
                        <YAxis
                          tick={{ fontSize: 10, fill: "#6B7A5C" }}
                          axisLine={false}
                          tickLine={false}
                          width={38}
                          tickFormatter={(v) => `$${v}`}
                          domain={["auto", "auto"]}
                        />
                        <Tooltip
                          contentStyle={{
                            background: "#F6F1E4", border: "1px solid #3B4430", borderRadius: 6,
                            fontFamily: "VT323", fontSize: 13, padding: "4px 8px",
                          }}
                          labelFormatter={(l) => `Day ${l}`}
                          formatter={(v) => [brl(v), "Price"]}
                        />
                        <ReferenceLine
                          y={selected.base}
                          stroke="#8A7C5C"
                          strokeDasharray="4 3"
                          label={{ value: "base", position: "insideTopRight", fontSize: 9, fill: "#8A7C5C" }}
                        />
                        <Area
                          type="monotone"
                          dataKey="p"
                          stroke={chartColor}
                          strokeWidth={2.5}
                          fill="url(#priceFill)"
                          dot={{ r: 2, fill: chartColor, strokeWidth: 0 }}
                          activeDot={{ r: 4 }}
                          isAnimationActive={false}
                        />
                      </AreaChart>
                    </ResponsiveContainer>
                  </div>
                  <div className="hint">TAP BUY OR PRESS B</div>
                </div>
              )}

              {view === "banco" && (
                <div className="bancoView">
                  <div style={{ fontSize: 12, color: "#3B4430" }}>BALANCE</div>
                  <div className="bancoNum">{brl(saldo)}</div>
                  <div style={{ fontSize: 12, color: "#3B4430" }}>SAVINGS (+1%/DAY)</div>
                  <div className="bancoNum">{brl(poupanca)}</div>
                  <div className="amtRow">
                    <button className="amtBtn" onClick={() => setDepositAmt((v) => Math.max(1, v - 5))}>-</button>
                    <span className="amtVal">{brl(Number(depositAmt))}</span>
                    <button className="amtBtn" onClick={() => setDepositAmt((v) => v + 5)}>+</button>
                  </div>
                  <div className="bancoActions">
                    <button className="miniBtn" onClick={depositar}>DEPOSIT</button>
                    <button className="miniBtn" onClick={sacar}>WITHDRAW</button>
                  </div>
                  <div className="hint">PRESS B TO DEPOSIT</div>
                </div>
              )}

              {view === "extrato" && (
                <div className="logList">
                  {log.map((l) => (
                    <div key={l.id} className="logRow">{l.text}</div>
                  ))}
                </div>
              )}
            </div>
              </>
            )}
          </div>
        </div>

        {authUser && (
          <div className="buttons">
            <button className="devBtn" onClick={prevView}>A</button>
            <button className="devBtn big" onClick={primaryAction}>B</button>
            <button className="devBtn" onClick={nextView}>C</button>
          </div>
        )}

        <div className="speaker">
          {Array.from({ length: 9 }).map((_, i) => (
            <span key={i} className="dot" />
          ))}
        </div>
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
